name: ci
on:
  push:
    branches: [main, universal]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Manifests are valid JSON
        run: |
          node -e "for (const f of ['plugin.json','.codex-plugin/plugin.json','.agents/plugins/marketplace.json','.claude-plugin/plugin.json','.claude-plugin/marketplace.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: Skill frontmatter has name and description
        run: |
          head -5 skills/artiboard/SKILL.md | grep -q '^name: artiboard$'
          head -5 skills/artiboard/SKILL.md | grep -q '^description: '
      - name: Skills CLI discovers and installs a runnable package
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          artiboard_source="$PWD"
          artiboard_install="$(mktemp -d)"
          trap 'rm -rf "$artiboard_install"' EXIT
          cd "$artiboard_install"
          npx --yes skills@1.7.4 add "$artiboard_source" --list
          npx --yes skills@1.7.4 add "$artiboard_source" --skill artiboard --agent codex --copy --yes
          for resource in SKILL.md LICENSE agents/openai.yaml assets/board.html assets/local.js scripts/local_board.py references/local.md references/artifact.md references/protocol.md; do
            test -f ".agents/skills/artiboard/$resource"
          done
          cmp "$artiboard_source/LICENSE" .agents/skills/artiboard/LICENSE
          python3 .agents/skills/artiboard/scripts/local_board.py init --title "Package smoke test" --person tester --lang en
          python3 .agents/skills/artiboard/scripts/local_board.py request <<'JSON' > config.json
          {"action":"get","path":"meta/config"}
          JSON
          python3 -c "import json; assert json.load(open('config.json'))['data']['title'] == 'Package smoke test'"
      - name: Board script parses
        run: |
          node -e "const s=require('fs').readFileSync('skills/artiboard/assets/board.html','utf8');require('fs').writeFileSync('/tmp/board.js',s.match(/<script>([\s\S]*)<\/script>/)[1])"
          node --check /tmp/board.js
          node --check skills/artiboard/assets/local.js
      - name: Local persistence and HTTP boundaries
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Board smoke test
        run: |
          npm install --no-save --no-audit --no-fund jsdom@24.1.1
          node tests/smoke.cjs
          node tests/local-smoke.cjs
      - name: Demo is built from the current page
        run: |
          node examples/build-demo.cjs
          git diff --exit-code -- examples/demo.html
